name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  client:
    uses: K-Schmitt/MyCI/.github/workflows/node-ci.yml@v1
    with:
      working-directory: client
  server:
    uses: K-Schmitt/MyCI/.github/workflows/node-ci.yml@v1
    with:
      working-directory: server
  docker:
    uses: K-Schmitt/MyCI/.github/workflows/docker-build.yml@v1
  deploy:
    needs: [client, server, docker]
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    uses: K-Schmitt/MyCI/.github/workflows/deploy-coolify.yml@v1
    with:
      coolify-url: ${{ vars.COOLIFY_URL }}
      app-uuid: ${{ vars.COOLIFY_APP_UUID }}
    secrets:
      coolify-token: ${{ secrets.COOLIFY_TOKEN }}
